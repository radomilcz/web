<style>
/* Barvy, písmo i otisk jako manifest (#3b2f2f / #e6acac, Agrandir, „Group 14“ z Figmy). */
@font-face{font-family:"Agrandir Grand Heavy";src:url(/assets/fonts/Agrandir-GrandHeavy.woff) format("woff");font-weight:800;font-display:swap}
@font-face{font-family:"Agrandir";src:url(/assets/fonts/Agrandir-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Agrandir Narrow Black";src:url(/assets/fonts/Agrandir-NarrowBlack.woff) format("woff");font-weight:900;font-display:swap}
@font-face{font-family:"Agrandir Grand";src:url(/assets/fonts/Agrandir-Grand.woff) format("woff");font-weight:400;font-display:swap}
:root{
  --ground:#3b2f2f;
  --ink:#e6acac;
  --display:"Agrandir Grand Heavy",system-ui,sans-serif;
  --body:"Agrandir",system-ui,sans-serif;
  --narrow:"Agrandir Narrow Black",system-ui,sans-serif;
  --grand:"Agrandir Grand",system-ui,sans-serif;
  --pad:clamp(20px,4vw,76px);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{
  margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;position:relative;
  background:var(--ground);color:var(--ink);
  font-family:var(--body);font-weight:400;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink);color:var(--ground)}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}

/* otisk – dva přes okraje, jako na manifestu */
.otisk{position:absolute;z-index:0;pointer-events:none;opacity:0;width:clamp(560px,78vw,1400px);aspect-ratio:998/816}
.otisk img{display:block;width:100%;height:100%;opacity:.3}
.otisk.a{right:-24%;top:-18%;--r:60deg}
.otisk.b{left:-30%;bottom:-34%;--r:-105deg}
.otisk{transform:rotate(var(--r)) scale(1.08);animation:tisk 1.8s cubic-bezier(.2,.7,.2,1) .2s forwards}
.otisk.b{animation-delay:.45s}
@keyframes tisk{to{opacity:1;transform:rotate(calc(var(--r) + 2deg))}}
.pozadi{position:absolute;inset:0;overflow:hidden;pointer-events:none}

.page{
  position:relative;z-index:1;min-height:100vh;min-height:100svh;padding:var(--pad);
  display:grid;grid-template-rows:auto 1fr auto;gap:clamp(2rem,5vh,4rem);
}
.brand,.eyebrow{
  font-family:var(--display);font-weight:800;font-size:clamp(1rem,2.3vw,2.75rem);
  line-height:1.035;margin:0;letter-spacing:-.01em;
}

.stred{align-self:center;display:flex;flex-direction:column;align-items:flex-start}
.brzy{
  margin:0;font-family:var(--narrow);font-weight:900;font-size:clamp(5.5rem,min(24vw,30vh),24rem);
  line-height:.9;letter-spacing:0;overflow:hidden;padding-top:.04em;
}
.brzy i{display:inline-block;font-style:normal;transform:translateY(110%);animation:vyjet 1.2s var(--ease) forwards}
.brzy i:nth-child(2){animation-delay:.07s}
.brzy i:nth-child(3){animation-delay:.14s}
.brzy i:nth-child(4){animation-delay:.21s}
@keyframes vyjet{to{transform:none}}
.sub{margin:.35em 0 0;font-family:var(--grand);font-size:clamp(1.25rem,3vw,3rem);line-height:1.1}

.odkazy{list-style:none;margin:clamp(2rem,5vh,5rem) 0 0;padding:0;display:grid;gap:clamp(1.1rem,2.6vh,1.9rem);width:100%;max-width:60rem}
.odkazy a{display:grid;grid-template-columns:auto 1fr;column-gap:.55em;align-items:baseline}
.odkazy a::before{content:"→";grid-row:span 2;font-size:clamp(1.6rem,3.6vw,3.5rem);line-height:1;transition:transform .5s var(--ease)}
.odkazy b{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.6vw,3.5rem);line-height:1.05;letter-spacing:-.01em}
.odkazy span{grid-column:2;font-size:clamp(1rem,1.5vw,1.5rem);line-height:1.3;opacity:.8;margin-top:.2em}
.odkazy a:hover::before,.odkazy a:focus-visible::before{transform:translateX(.25em)}
.odkazy a:hover b,.odkazy a:focus-visible b{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.14em}

.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem 2rem;flex-wrap:wrap}
.kontakt{margin:0;font-size:clamp(1rem,1.55vw,1.875rem);line-height:1.3}
.kontakt a{border-bottom:.08em solid currentColor;overflow-wrap:anywhere}
.kontakt a:hover{border-bottom-color:transparent}
.foot .brand{margin-left:auto;white-space:nowrap}

.rise{opacity:0;transform:translateY(.6em);animation:vynor 1s var(--ease) forwards}
.sub.rise{animation-delay:.55s}
.odkazy .rise:nth-child(1){animation-delay:.75s}
.odkazy .rise:nth-child(2){animation-delay:.85s}
.foot.rise{animation-delay:1s}
@keyframes vynor{to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .otisk,.brzy i,.rise{animation:none;opacity:1;transform:none}
  .otisk{transform:rotate(var(--r))}
}
</style>
</head>
<body>

<div class="pozadi" aria-hidden="true">
  <div class="otisk a"><img src="/assets/otisk.svg" alt=""></div>
  <div class="otisk b"><img src="/assets/otisk.svg" alt=""></div>
</div>

<div class="page">

  <header>
    <p class="eyebrow">církev jako kráva</p>
  </header>

  <main class="stred">
    <h1 class="brzy" aria-label="Brzy"><i>B</i><i>R</i><i>Z</i><i>Y</i></h1>
    <p class="sub rise">Web se ještě pase. Zatím si přečti:</p>
    <ul class="odkazy">
      <li class="rise"><a href="https://manifest.cirkevjakokrava.cz"><b>Manifest</b><span>Kdo jsme. Co děláme. Jak, pro koho a proč.</span></a></li>
      <li class="rise"><a href="https://otazky.cirkevjakokrava.cz"><b>Otázky na tělo</b><span>Koučovací otázky ke kultuře komunity. K přežvýkání i k tisku.</span></a></li>
    </ul>
  </main>

  <footer class="foot rise">
    <p class="kontakt">Máš dotaz? Napiš nám:<br><a href="mailto:ahoj@cirkevjakokrava.cz">ahoj@cirkevjakokrava.cz</a></p>
    <p class="brand">cirkevjakokrava.cz</p>
  </footer>

</div>
</body>
</html>
